name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies with platform-specific binaries
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu --save-optional
          npm rebuild
        env:
          npm_config_target_platform: linux
          npm_config_target_arch: x64

      - name: Verify Rollup installation
        run: |
          ls node_modules/@rollup/ || echo "No @rollup directory found"
          npm list rollup

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Fallback build (if main build fails)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --no-optional
          npm install rollup vite
          npm run build

      - name: Create 404 page
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: panel.seniorblockchain.io
